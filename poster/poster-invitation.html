<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prom Night 2026 Invitation Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
<link href="../css/bootstrap-icons.css" rel="stylesheet">
<link href="base.css" rel="stylesheet">
<style>
  .page { width: 1080px; height: 1350px; background: #f7f0e4; color: #241a14; }
  .paper { position: absolute; inset: 0; z-index: -2; background: radial-gradient(circle at 50% 0%, #fffaf1, #f3e9d8 70%); }
  .frame { position: absolute; inset: 36px; border: 1.5px solid #c9a24f; z-index: 0; }
  .frame::after { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(201, 162, 79, .45); }

  .content { position: relative; z-index: 1; height: 100%; padding: 84px 110px 80px; display: flex; flex-direction: column; align-items: center; text-align: center; }

  .arch {
    width: 440px; height: 500px;
    border-radius: 220px 220px 18px 18px;
    background: url("../images/ball.jpg") center / cover;
    box-shadow: 0 24px 50px rgba(60, 40, 20, .25);
    outline: 1.5px solid #c9a24f; outline-offset: 10px;
  }
  .script { font-family: "Great Vibes", cursive; font-size: 64px; color: #b08a3c; margin-top: 30px; line-height: 1; }
  h1 { font-size: 92px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; line-height: 1; margin-top: 6px; }
  .year { font-size: 30px; letter-spacing: .6em; color: #b08a3c; margin-top: 10px; font-weight: 500; padding-left: .6em; }

  .rule { display: flex; align-items: center; gap: 16px; color: #b08a3c; margin: 26px 0 20px; }
  .rule b { width: 130px; height: 1px; background: #c9a24f; }

  .info { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 26px; }
  .info .sep { width: 1px; height: 58px; background: #d8c194; }
  .info strong { display: block; font-family: "Playfair Display", serif; font-size: 30px; font-weight: 600; }
  .info span { font-size: 15px; letter-spacing: .3em; text-transform: uppercase; color: #8a7158; }

  .theme { margin-top: 24px; font-family: "Playfair Display", serif; font-style: italic; font-size: 24px; color: #5b4636; }

  .foot { margin-top: auto; display: flex; align-items: center; gap: 26px; text-align: left; }
  .foot .qr { border: 1.5px solid #c9a24f; padding: 8px; border-radius: 10px; }
  .foot .qr img { width: 112px; height: 112px; }
  .foot .t1 { font-size: 14px; letter-spacing: .3em; text-transform: uppercase; color: #b08a3c; font-weight: 600; }
  .foot .t2 { font-family: "Playfair Display", serif; font-size: 32px; font-weight: 700; }
  .foot .t3 { font-size: 17px; color: #6d5a49; }
</style>
</head>
<body>
<div class="page">
  <div class="hashtag dark">#PromNightEldoret2026</div>
  <div class="paper"></div>
  <div class="frame"></div>

  <div class="content">
    <div class="arch"></div>
    <div class="script">You&rsquo;re invited to</div>
    <h1 class="serif">Prom Night</h1>
    <div class="year">2026</div>

    <div class="rule"><b></b><i class="bi-suit-heart-fill"></i><b></b></div>

    <div class="info">
      <div><strong>Thursday</strong><span>10 Dec 2026</span></div>
      <div class="sep"></div>
      <div><strong>6:00 PM</strong><span>Doors open</span></div>
      <div class="sep"></div>
      <div><strong>Boma Inn</strong><span>Eldoret</span></div>
    </div>

    <p class="theme">Dinner, dancing &amp; the crowning of Mr &amp; Miss Prom</p>

    <div class="foot">
      <div class="qr"><img src="../images/zenlipa-qr.png" alt=""></div>
      <div>
        <div class="t1">Kindly book your seat</div>
        <div class="t2">Tickets from KSh 3,500</div>
        <div class="t3">prom2026.online &nbsp;&middot;&nbsp; 0717 436 668 &nbsp;&middot;&nbsp; 0792 100 146</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
