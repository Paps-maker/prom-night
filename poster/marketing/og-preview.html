<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prom Night 2026 Link Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,800;0,900;1,700&display=swap" rel="stylesheet">
<link href="../../css/bootstrap-icons.css" rel="stylesheet">
<link href="../base.css" rel="stylesheet">
<style>
  /* Link preview shown by WhatsApp, Facebook and X, rendered to images/og-preview.jpg */
  .page { width: 1200px; height: 630px; color: #fff; background: #0e0a14; }
  .cover { background-image: url("../../images/royal.jpg"); left: 46%; background-position: center 40%; }
  .layer { background: linear-gradient(90deg, #0e0a14 44%, rgba(14, 10, 20, .75) 62%, rgba(14, 10, 20, .15)); }
  .content { position: relative; height: 100%; padding: 56px 64px; display: flex; flex-direction: column; justify-content: center; }
  .top { display: flex; align-items: center; gap: 14px; }
  .top img { width: 56px; height: 56px; border-radius: 50%; border: 2px solid #e3b75a; object-fit: cover; }
  .top span { font-size: 18px; letter-spacing: .35em; text-transform: uppercase; font-weight: 600; color: #f6e3b8; }
  h1 { margin-top: 22px; font-size: 128px; font-weight: 900; line-height: .9; }
  .year { font-size: 40px; letter-spacing: .55em; font-weight: 300; margin-top: 12px; }
  .when { margin-top: 28px; display: flex; gap: 26px; font-size: 25px; font-weight: 500; }
  .when i { color: #e3b75a; margin-right: 10px; }
  .price { margin-top: 30px; display: inline-flex; align-self: flex-start; align-items: center; gap: 14px; padding: 14px 28px; border-radius: 999px; background: linear-gradient(135deg, #fff1c9, #e3b75a 45%, #b8862f); color: #1a1206; font-size: 26px; font-weight: 800; }
</style>
</head>
<body>
<div class="page">
  <div class="cover"></div>
  <div class="layer"></div>
  <span class="spark" style="top:90px;left:560px"></span><span class="spark" style="top:480px;left:620px;transform:scale(.6)"></span>
  <div class="content">
    <div class="top"><img src="../../images/pr logo.png" alt=""><span>Boma Inn, Eldoret</span></div>
    <h1 class="serif gold-text">PROM NIGHT</h1>
    <div class="year">2026</div>
    <div class="when"><div><i class="bi-calendar-event"></i>Thursday, 10 December</div><div><i class="bi-clock"></i>6:00 PM</div></div>
    <div class="price"><i class="bi-ticket-perforated"></i>Tickets from KSh 3,500</div>
  </div>
</div>
</body>
</html>
