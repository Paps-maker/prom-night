<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prom Night 2026 Thank You</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,800;0,900;1,700&family=Great+Vibes&display=swap" rel="stylesheet">
<link href="../../css/bootstrap-icons.css" rel="stylesheet">
<link href="../base.css" rel="stylesheet">
<style>
  /* Post this the morning after the event */
  .page { width: 1080px; height: 1350px; color: #fff; background: #0e0a14; }
  .cover { background-image: url("../../images/countdown/pexels-31196839.jpg"); bottom: 40%; }
  .layer { background: linear-gradient(180deg, rgba(14, 10, 20, .2), rgba(14, 10, 20, .45) 35%, #0e0a14 60%); }
  .content { position: relative; height: 100%; padding: 80px 90px 70px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 20px; letter-spacing: .4em; text-transform: uppercase; font-weight: 700; }
  .brand img { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #e3b75a; object-fit: cover; }
  .script { margin-top: 380px; font-family: "Great Vibes", cursive; font-size: 120px; color: #f6e3b8; line-height: 1; }
  h1 { font-size: 150px; font-weight: 900; line-height: .95; margin-top: 4px; }
  .lead { margin-top: 30px; font-size: 34px; font-weight: 300; color: #ddd0ea; line-height: 1.45; max-width: 820px; }
  .heart { margin-top: 30px; font-size: 44px; color: #e2457a; }
  .next { margin-top: auto; padding: 22px 40px; border-radius: 999px; border: 2px solid rgba(227, 183, 90, .6); font-size: 28px; font-weight: 600; }
  .next b { color: #f6d892; }
  .tag { margin-top: 22px; font-size: 24px; letter-spacing: .12em; font-weight: 600; color: rgba(255, 255, 255, .6); }
</style>
</head>
<body>
<div class="page">
  <div class="cover"></div>
  <div class="layer"></div>
  <span class="spark" style="top:420px;left:150px"></span><span class="spark" style="top:520px;left:920px"></span>
  <div class="content">
    <div class="brand"><img src="../../images/pr logo.png" alt="">Prom Night 2026</div>
    <div class="script">Thank you,</div>
    <h1 class="serif gold-text">Eldoret</h1>
    <p class="lead">For the glamour, the dancing and the memories. You made Prom Night 2026 unforgettable.</p>
    <div class="heart"><i class="bi-suit-heart-fill"></i></div>
    <div class="next">Tag yourself in our photos and <b>see you next year</b></div>
    <div class="tag">#PromNightEldoret2026</div>
  </div>
</div>
</body>
</html>
