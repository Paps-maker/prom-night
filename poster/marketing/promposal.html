<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prom Night 2026 Invitation Card</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,800;1,600;1,700&family=Great+Vibes&display=swap" rel="stylesheet">
<link href="../../css/bootstrap-icons.css" rel="stylesheet">
<link href="../base.css" rel="stylesheet">
<style>
  .page { width: 1080px; height: 1350px; color: #fff; background: #1a050b; }
  .cover { background-image: url("../../images/countdown/pexels-30767993.jpg"); bottom: 50%; filter: saturate(1.1); }
  .layer { background: linear-gradient(180deg, rgba(26, 5, 11, .2), rgba(26, 5, 11, .5) 28%, #1a050b 47%); }
  .glow { position: absolute; left: 50%; top: 46%; width: 1000px; height: 600px; transform: translate(-50%, -50%); background: radial-gradient(ellipse, rgba(255, 80, 110, .3), transparent 65%); z-index: -1; }

  .card { position: absolute; inset: 40px; border: 2px solid rgba(246, 216, 146, .55); border-radius: 30px; }
  .content { position: relative; height: 100%; padding: 90px 110px 90px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .to { font-size: 22px; letter-spacing: .4em; text-transform: uppercase; font-weight: 600; padding: 10px 26px; border-radius: 999px; background: rgba(0, 0, 0, .45); border: 1px solid rgba(255, 255, 255, .3); }

  .script { margin-top: 430px; font-family: "Great Vibes", cursive; font-size: 96px; color: #ffd0d8; line-height: 1; text-shadow: 0 6px 30px rgba(0, 0, 0, .6); }
  h1 { font-size: 112px; font-weight: 800; line-height: .98; margin-top: 4px; text-shadow: 0 10px 40px rgba(0, 0, 0, .5); }
  h1 em { font-style: italic; }

  .answer { margin-top: 44px; display: flex; gap: 22px; }
  .answer div { display: flex; align-items: center; gap: 14px; padding: 16px 30px; border-radius: 18px; border: 2px solid rgba(255, 255, 255, .4); font-size: 30px; font-weight: 600; }
  .answer span { width: 34px; height: 34px; border: 2.5px solid #f6d892; border-radius: 8px; display: grid; place-items: center; }
  .answer .yes span::after { content: "\F633"; font-family: "bootstrap-icons"; color: #f6d892; font-size: 30px; }
  .answer .yes { border-color: #f6d892; background: rgba(227, 183, 90, .14); }

  .when { margin-top: 44px; font-size: 26px; color: #ffd6df; }
  .when b { color: #fff; font-weight: 600; }

  .foot { margin-top: auto; width: 100%; display: flex; align-items: center; gap: 28px; padding: 26px 30px; border-radius: 26px; background: rgba(0, 0, 0, .4); border: 1px solid rgba(246, 216, 146, .35); text-align: left; }
  .foot .qr img { width: 130px; height: 130px; }
  .foot .t1 { font-size: 16px; letter-spacing: .3em; text-transform: uppercase; color: #f6d892; font-weight: 700; }
  .foot .prices { display: flex; gap: 30px; margin: 10px 0 8px; }
  .foot .prices div { font-size: 20px; color: #e6cdd3; }
  .foot .prices b { display: block; font-family: "Playfair Display", serif; font-size: 40px; color: #fff; line-height: 1.15; }
  .foot .t3 { font-size: 19px; color: #d7bcc3; }
</style>
</head>
<body>
<div class="page">
  <div class="hashtag" style="bottom:52px">#PromNightEldoret2026</div>
  <div class="cover"></div>
  <div class="layer"></div>
  <div class="glow"></div>
  <div class="card"></div>
  <span class="spark" style="top:130px;left:170px"></span><span class="spark" style="top:250px;left:900px"></span><span class="spark" style="top:420px;left:120px;transform:scale(.6)"></span>

  <div class="content">
    <div class="to">Prom Night 2026</div>
    <div class="script">Will you go to</div>
    <h1 class="serif">Prom <em class="gold-text">with me?</em></h1>

    <div class="answer">
      <div class="yes"><span></span>Yes</div>
      <div><span></span>Of course</div>
      <div><span></span>Absolutely</div>
    </div>

    <p class="when"><b>Thursday, 10 December</b> &nbsp;&middot;&nbsp; 6:00 PM &nbsp;&middot;&nbsp; <b>Boma Inn, Eldoret</b></p>

    <div class="foot">
      <div class="qr"><img src="../../images/zenlipa-qr.png" alt=""></div>
      <div>
        <div class="t1">Couple tickets</div>
        <div class="prices">
          <div>Couple<b>KSh 6,000</b></div>
          <div>Couple + Transport<b>KSh 9,000</b></div>
        </div>
        <div class="t3">Scan to book &nbsp;&middot;&nbsp; prom2026.online</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
