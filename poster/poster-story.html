<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prom Night 2026 Story Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,800;1,700&display=swap" rel="stylesheet">
<link href="../css/bootstrap-icons.css" rel="stylesheet">
<link href="base.css" rel="stylesheet">
<style>
  .page { width: 1080px; height: 1920px; color: #fff; background: #0b0910; }
  .cover { background-image: url("../images/dj.jpg"); bottom: 30%; }
  .layer {
    background:
      radial-gradient(ellipse at 20% 30%, rgba(226, 69, 122, .45), transparent 50%),
      radial-gradient(ellipse at 85% 45%, rgba(227, 183, 90, .3), transparent 50%),
      linear-gradient(180deg, rgba(11, 9, 16, .35) 0%, rgba(11, 9, 16, .4) 40%, #0b0910 70%);
  }

  .content { position: relative; height: 100%; padding: 120px 80px 130px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .pill { padding: 12px 28px; border-radius: 999px; background: linear-gradient(135deg, #ff6b9a, #c2185b); font-size: 22px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; box-shadow: 0 10px 30px rgba(226, 69, 122, .5); }

  .sub { margin-top: 470px; font-size: 34px; letter-spacing: .45em; text-transform: uppercase; font-weight: 300; color: #ffd6e4; padding-left: .45em; }
  h1 { font-size: 190px; font-weight: 800; line-height: .88; margin-top: 10px; text-shadow: 0 10px 50px rgba(0, 0, 0, .6); }
  h1 em { display: block; font-size: 150px; font-style: italic; font-weight: 700; }

  .date { margin-top: 46px; display: flex; align-items: stretch; border-radius: 26px; overflow: hidden; border: 1.5px solid rgba(227, 183, 90, .6); background: rgba(20, 15, 28, .75); }
  .date .day { padding: 22px 34px; background: linear-gradient(135deg, #fbe3a6, #e3b75a 45%, #b8862f); color: #1a1206; }
  .date .day b { display: block; font-family: "Playfair Display", serif; font-size: 84px; line-height: .95; }
  .date .day span { font-size: 22px; font-weight: 700; letter-spacing: .25em; }
  .date .rest { padding: 24px 34px; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 8px; font-size: 30px; font-weight: 500; }
  .date .rest i { color: #e3b75a; margin-right: 12px; }

  .vibes { margin-top: 44px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 900px; }
  .vibes span { padding: 12px 24px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .06); font-size: 24px; }

  .foot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .foot .qr img { width: 210px; height: 210px; }
  .foot .t1 { font-size: 26px; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; }
  .foot .t2 { font-size: 24px; color: #cbbfd8; }
  .foot .t2 b { color: #f6d892; font-weight: 600; }
</style>
</head>
<body>
<div class="page">
  <div class="hashtag" style="bottom:60px">#PromNightEldoret2026</div>
  <div class="cover"></div>
  <div class="layer"></div>
  <span class="spark" style="top:240px;left:160px"></span><span class="spark" style="top:380px;left:920px"></span><span class="spark" style="top:620px;left:90px;transform:scale(.7)"></span>

  <div class="content">
    <div class="pill">Tickets on sale</div>
    <div class="sub">The countdown is on</div>
    <h1 class="serif">Prom<em class="gold-text">Night</em></h1>

    <div class="date">
      <div class="day"><b>10</b><span>DEC</span></div>
      <div class="rest">
        <div><i class="bi-clock"></i>Thursday, 6:00 PM</div>
        <div><i class="bi-geo-alt"></i>Boma Inn, Eldoret</div>
      </div>
    </div>

    <div class="vibes">
      <span>Red Carpet</span><span>Three Course Dinner</span><span>Live DJ</span><span>Crowning</span>
    </div>

    <div class="foot">
      <div class="qr"><img src="../images/zenlipa-qr.png" alt=""></div>
      <div class="t1">Scan to get your ticket</div>
      <div class="t2">From <b>KSh 3,500</b> &nbsp;&middot;&nbsp; prom2026.online</div>
    </div>
  </div>
</div>
</body>
</html>
